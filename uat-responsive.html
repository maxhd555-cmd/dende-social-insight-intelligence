<!doctype html><meta charset="utf-8"><title>Dende UAT responsive</title><style>body{font:12px system-ui;margin:0}.case{position:absolute;left:-10000px}.phone{width:390px;height:844px}.tablet{width:820px;height:900px}</style><body><script>
window.__uat={};
const cases=[['phone-dashboard',390,'dashboard'],['phone-workspaces',390,'workspaces'],['tablet-dashboard',820,'dashboard'],['tablet-workspaces',820,'workspaces']];
for(const [id,w,route] of cases){const f=document.createElement('iframe');f.className='case '+(w===390?'phone':'tablet');f.src='/?responsive='+id+'#'+encodeURIComponent(route);document.body.append(f);f.addEventListener('load',()=>setTimeout(()=>{const d=f.contentDocument,de=d.documentElement;window.__uat[id]={inner:f.contentWindow.innerWidth,client:de.clientWidth,scroll:de.scrollWidth,overflow:de.scrollWidth>de.clientWidth+1,title:d.title,h1:(d.querySelector('.page h1,.dash-title')?.textContent||'').trim(),mobileMenu:getComputedStyle(d.querySelector('#menuToggle')).display};},150),{once:true})}
</script>
