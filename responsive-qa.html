<!doctype html><meta charset="utf-8"><title>Dende responsive QA</title><style>iframe{display:block;border:0;margin:8px}.phone{width:390px;height:844px}.tablet{width:820px;height:900px}</style><div id="out">checking</div><iframe id="phone" class="phone" src="/?qa=phone#workspaces"></iframe><iframe id="tablet" class="tablet" src="/?qa=tablet#workspaces"></iframe><script>const results={};function check(id){const f=document.getElementById(id);f.onload=()=>setTimeout(()=>{const w=f.contentWindow,d=f.contentDocument.documentElement;results[id]={innerWidth:w.innerWidth,clientWidth:d.clientWidth,scrollWidth:d.scrollWidth,overflow:d.scrollWidth>d.clientWidth+1,title:f.contentDocument.title};document.getElementById('out').textContent=JSON.stringify(results)},500)}check('phone');check('tablet');</script>
