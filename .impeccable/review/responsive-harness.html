<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SignalDesk responsive QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#eef0f2;font:14px/1.4 system-ui,sans-serif;color:#171b21}.case{margin:0 0 24px}.status{margin:0 0 8px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.phone{width:390px;height:844px;border:1px solid #c9cdd1;background:#fff}.tablet{width:820px;height:900px;border:1px solid #c9cdd1;background:#fff}
  </style>
</head>
<body>
  <section class="case"><div class="status" id="phoneStatus">phone: checking…</div><iframe id="phone" class="phone" src="/?qa=phone#dashboard" title="390px mobile QA"></iframe></section>
  <section class="case"><div class="status" id="tabletStatus">tablet: checking…</div><iframe id="tablet" class="tablet" src="/?qa=tablet#dashboard" title="820px tablet QA"></iframe></section>
  <script>
    function inspect(id,label){
      const frame=document.getElementById(id);
      frame.addEventListener('load',()=>setTimeout(()=>{
        const win=frame.contentWindow,doc=frame.contentDocument,de=doc.documentElement;
        const result={label,innerWidth:win.innerWidth,clientWidth:de.clientWidth,scrollWidth:de.scrollWidth,overflow:de.scrollWidth>de.clientWidth+1,title:doc.title};
        document.getElementById(id+'Status').textContent=label+': '+JSON.stringify(result);
        frame.dataset.result=JSON.stringify(result);
      },500),{once:true});
    }
    inspect('phone','phone');inspect('tablet','tablet');
  </script>
</body>
</html>
